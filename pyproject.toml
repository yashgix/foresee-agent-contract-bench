[project]
name = "agent-contract-bench"
version = "0.1.0"
description = "Checks how faithfully AI assistants relay Foresee insurance quote results, and whether Foresee's published agent docs agree."
requires-python = ">=3.14"
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.4"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
